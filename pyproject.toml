[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Keep the rule set ruff used before 0.17.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = ["--strict-markers", "--tb=short"]
