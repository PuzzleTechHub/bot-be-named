[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# The rule set ruff used before 0.17, plus pyupgrade (UP: list[int], X | None, ...),
# RUF013 (a "= None" default needs "| None" in its type hint), import sorting (I),
# flake8-bugbear (B), blocking calls in async code (ASYNC) and RET503 (a function that
# returns a value on some paths must say what it returns on the rest), and flake8-simplify
# (SIM) without SIM300: it reads ALL_CAPS module dicts the tests change, like
# database.CHANNEL_MIRRORS, as constants and asks for `assert {...} == x`.
select = ["E4", "E7", "E9", "F", "UP", "RUF013", "I", "B", "ASYNC", "RET503", "SIM"]
ignore = ["SIM300"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = ["--strict-markers", "--tb=short"]
